name: Build AGAN PONSEL Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Flutter Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform (if needed)
        run: flutter create --platforms=android --project-name agan_ponsel .

      - name: Configure Android permissions and remove sample tests
        run: python3 scripts/prepare_android.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate branded Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate branded native splash
        run: dart run flutter_native_splash:create

      - name: Check Dart code formatting
        run: dart format lib test

      - name: Validate visible copy
        run: python3 scripts/check_labels.py

      - name: Check AGANA SQLite migration
        run: python3 scripts/smoke_agent_sqlite.py

      - name: Smoke test receivable detail migration
        run: python3 scripts/smoke_receivable_details.py

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run basic unit tests
        run: flutter test test/format_test.dart test/feature_test.dart test/theme_contrast_test.dart test/receivables_test.dart test/agana_intents_test.dart test/ai_providers_test.dart test/receivable_details_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGAN-PONSEL-v0.9.3-Build16-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

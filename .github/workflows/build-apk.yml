name: Build AGAN PONSEL Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Flutter Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform (if needed)
        run: flutter create --platforms=android --project-name agan_ponsel .

      - name: Configure Android permissions and remove sample tests
        run: python3 scripts/prepare_android.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify safe Android preferences plugin
        run: |
          flutter pub deps --style=compact > /tmp/agan-deps.txt
          if ! grep -E 'shared_preferences_android[[:space:]]+2\.4\.28([[:space:]]|$)' /tmp/agan-deps.txt; then
            echo '::error::shared_preferences_android must remain at version 2.4.28 in Build 20.'
            exit 1
          fi

      - name: Generate branded Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate branded native splash
        run: dart run flutter_native_splash:create

      # Native splash generation can rewrite Android themes. Reapply safe
      # AppCompat/FragmentActivity configuration for the PIN biometric screen.
      - name: Finalize Android startup theme
        run: python3 scripts/prepare_android.py

      - name: Check startup guard files
        run: python3 scripts/check_startup_safety.py

      - name: Check Dart code formatting
        run: dart format lib test

      - name: Validate visible copy
        run: python3 scripts/check_labels.py

      - name: Check AGANA SQLite migration
        run: python3 scripts/smoke_agent_sqlite.py

      - name: Smoke test receivable detail migration
        run: python3 scripts/smoke_receivable_details.py

      - name: Smoke test receipt records and v10 migration
        run: python3 scripts/smoke_receipt_v10.py

      - name: Smoke test v11 payment edits and dated bon
        run: python3 scripts/smoke_receivable_v11.py

      - name: Check Build23 cloud/alarms integration
        run: python3 scripts/check_build23.py

      - name: Check AGAN PONSEL Build24
        run: |
          python3 scripts/check_build24.py
          python3 scripts/smoke_expenses_v12.py

      - name: Smoke test expense quantities and category visuals v13
        run: |
          python3 scripts/check_build25.py
          python3 scripts/smoke_expenses_v13.py

      - name: Check Build26 finance insights and backup settings
        run: |
          python3 scripts/check_build26.py
          python3 scripts/smoke_budget_backup.py

      - name: Validate Build27 suppliers and restock migration
        run: |
          python3 scripts/check_build27.py
          python3 scripts/smoke_restock_v14.py

      - name: Check Build28 notes, finance and digital SQLite
        run: |
          python3 scripts/check_build28.py
          python3 scripts/smoke_operations_v15.py

      - name: Validate Build29 premium cash card and settings
        run: |
          python3 scripts/check_build29.py
          python3 scripts/smoke_cash_card_settings.py

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run basic unit tests
        run: flutter test test/format_test.dart test/feature_test.dart test/theme_contrast_test.dart test/receivables_test.dart test/agana_intents_test.dart test/ai_providers_test.dart test/receivable_details_test.dart test/receivable_receipt_test.dart test/receivable_build22_test.dart test/build23_schedule_test.dart test/build24_expenses_test.dart test/build26_insights_test.dart test/build27_restock_test.dart test/build28_store_plus_test.dart test/build29_cash_card_test.dart

      - name: Install Node.js 22 for WhatsApp tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate AGANA WhatsApp integration
        run: python3 scripts/check_wa_feature.py

      - name: Test WhatsApp Agent Webhook
        run: |
          node --version
          cd whatsapp-agent-server
          node --test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGAN-PONSEL-v1.9.0-Build29-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

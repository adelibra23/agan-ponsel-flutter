name: agan_ponsel
description: AGAN PONSEL Android - dashboard, kasir, stok, service, laporan.
publish_to: none
version: 1.0.3+20

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  file_picker: ^13.1.0
  crypto: ^3.0.6
  print_bluetooth_thermal: ^1.2.5
  permission_handler: ^12.0.3
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  flutter_contacts: ^1.1.9+2
  local_auth: ^2.3.0
  http: ^1.4.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Hotfix Android release startup regression in shared_preferences_android 2.5.0.
# Keep the version fixed until a verified upstream R8/JNI fix is available.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  assets:
    - assets/branding/agan_launcher.png
    - assets/branding/agan_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/agan_launcher.png
  adaptive_icon_background: "#091B4A"
  adaptive_icon_foreground: assets/branding/agan_foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#050F2A"
  image: assets/branding/agan_launcher.png
  android_12:
    color: "#050F2A"
    image: assets/branding/agan_launcher.png
  android: true
  ios: false
  web: false
